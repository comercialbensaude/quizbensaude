<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUIZ ONLINE - BENSAÚDE</title>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      text-transform: uppercase; 
    }
    
    body { 
      background-color: #004F9A; 
      color: #333; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      margin: 0; 
      padding: 120px 20px 40px 20px; 
    }

    .header-fixed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #ffffff;
      padding: 15px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
    }

    .header-fixed img {
      max-height: 55px;
      width: auto;
    }

    .quiz-container { 
      background: #ffffff; 
      padding: 30px; 
      border-radius: 12px; 
      max-width: 750px; 
      width: 100%; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.2); 
      border-top: 6px solid #44C8F5;
    }

    .header-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 2px solid #44C8F5; 
      padding-bottom: 15px; 
      margin-bottom: 20px; 
    }

    h1 { margin: 0; color: #004F9A; font-size: 22px; font-weight: 800; }

    .btn-admin { 
      background: #44C8F5; 
      color: #004F9A; 
      border: none; 
      padding: 8px 15px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 12px; 
      font-weight: bold;
    }
    
    .step { display: none; }
    .step.active { display: block; }
    
    label { font-weight: bold; display: block; margin-top: 15px; color: #004F9A; }

    input[type="text"], input[type="password"] { 
      width: 100%; 
      padding: 12px; 
      margin-top: 5px; 
      border: 2px solid #ccc; 
      border-radius: 6px; 
      font-size: 14px;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #44C8F5;
      outline: none;
    }
    
    .question { 
      margin-bottom: 25px; 
      background: #f4f9fc; 
      padding: 18px; 
      border-radius: 8px; 
      border-left: 6px solid #004F9A; 
    }

    .question p { font-weight: bold; margin-bottom: 12px; color: #004F9A; }

    .option { 
      margin: 10px 0; 
      display: flex; 
      align-items: center; 
      cursor: pointer; 
      background: #ffffff;
      padding: 10px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }

    .option input { margin-right: 12px; accent-color: #004F9A; }
    
    button.btn-primary { 
      background: #004F9A; 
      color: #ffffff; 
      border: none; 
      padding: 14px 20px; 
      font-size: 16px; 
      font-weight: bold;
      border-radius: 6px; 
      cursor: pointer; 
      width: 100%; 
      margin-top: 20px; 
    }

    button.btn-primary:disabled { background: #cccccc; cursor: not-allowed; }

    .error { color: #d9534f; font-weight: bold; margin-top: 10px; display: none; }

    /* Feedback de Resposta e Resultado detalhado */
    .feedback-box {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
    }
    .feedback-correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .feedback-wrong { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    .summary-card {
      background: #f8f9fa;
      border-left: 4px solid #004F9A;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 6px;
      text-align: left;
    }
    .summary-card.correct { border-left-color: #28a745; }
    .summary-card.wrong { border-left-color: #dc3545; }

    /* Estilos do Painel Administrativo */
    .admin-card { background: #f8f9fa; border: 1px solid #004F9A; border-radius: 6px; padding: 15px; margin-bottom: 20px; }
    .admin-option-row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
    .admin-option-row input[type="text"] { flex: 1; margin: 0; }
    .admin-option-row label { margin: 0; font-size: 11px; display: flex; align-items: center; gap: 4px; cursor: pointer; color: #28a745; }
    .btn-delete-q { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; float: right; font-weight: bold; }
    .btn-add-q { background: #44C8F5; color: #004F9A; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
    .btn-save-config { background: #004F9A; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>

<div class="header-fixed">
  <img src="LOGO_BENSAUDE.png" alt="BENSAÚDE - HOSPITAL BENEFICÊNCIA PORTUGUESA">
</div>

<div class="quiz-container">
  <div class="header-bar">
    <h1>QUIZ DE CONHECIMENTOS</h1>
    <button class="btn-admin" onclick="solicitarSenhaAdmin()">⚙️ GERENCIAR PERGUNTAS</button>
  </div>

  <!-- ETAPA 1: NOME E CPF -->
  <div id="step-cpf" class="step active">
    <p>PARA INICIAR O QUIZ, PREENCHA SEUS DADOS. CADA CPF SÓ PODERÁ PARTICIPAR UMA ÚNICA VEZ.</p>
    
    <label for="nome">NOME COMPLETO:</label>
    <input type="text" id="nome" placeholder="DIGITE SEU NOME COMPLETO">

    <label for="cpf">CPF (SOMENTE NÚMEROS):</label>
    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
    
    <div id="cpf-error" class="error"></div>
    <button class="btn-primary" onclick="iniciarQuiz()">INICIAR QUIZ</button>
  </div>

  <!-- ETAPA 2: PERGUNTAS -->
  <div id="step-quiz" class="step">
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="button" id="btn-submit" class="btn-primary" onclick="finalizarQuiz()">ENVIAR RESPOSTAS</button>
    </form>
  </div>

  <!-- ETAPA 3: RESULTADO -->
  <div id="step-result" class="step">
    <h2>RESULTADO DO QUIZ</h2>
    <h3 id="score-display" style="color: #004F9A;"></h3>
    <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;">
    <h4 style="color: #004F9A; text-align: left;">DETALHAMENTO POR QUESTÃO:</h4>
    <div id="summary-container"></div>
    <button class="btn-primary" onclick="location.reload()">VOLTAR AO INÍCIO</button>
  </div>

  <!-- ETAPA ADMIN -->
  <div id="step-admin" class="step">
    <h2>GERENCIADOR DE PERGUNTAS E RESPOSTAS</h2>
    <p style="font-size: 12px; color: #666;">MARQUE O BOTÃO VERDE AO LADO DA ALTERNATIVA QUE FOR A CORRETA.</p>
    <button class="btn-add-q" onclick="adicionarPerguntaUI()">+ ADICIONAR NOVA PERGUNTA</button>
    <div id="admin-questions-list"></div>
    <button class="btn-save-config" onclick="salvarConfiguracoes()">💾 SALVAR ALTERAÇÕES</button>
    <button class="btn-admin" style="width: 100%; margin-top: 10px; background: #ccc; color: #333;" onclick="cancelarConfiguracoes()">VOLTAR SEM SALVAR</button>
  </div>
</div>

<script>
  const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzjW5rqhIPsA33YYr5GQC6Fq81PcgB3-zeQlPcmztw9Qm3bxuN8rMnkfceFZuRWsYnsEA/exec";
  const SENHA_ADMIN = "Bensaude4477";

  const perguntasPadrao = [
    {
      enunciado: "1. QUAL É O FOCO PRINCIPAL DAS BOAS PRÁTICAS DE ATENDIMENTO?",
      correta: 0,
      opcoes: [
        "GARANTIR A SEGURANÇA E SATISFAÇÃO DO PACIENTE",
        "PREENCHER FORMULÁRIOS RAPIDAMENTE",
        "REDUZIR O TEMPO DE CONVERSA COM O PACIENTE",
        "EVITAR O USO DE EQUIPAMENTOS DE PROTEÇÃO"
      ]
    }
  ];

  let cpfAtual = "";
  let nomeAtual = "";
  let perguntasCarregadas = [];

  function obterPerguntas() {
    const salvas = localStorage.getItem('quiz_perguntas_config');
    return salvas ? JSON.parse(salvas) : perguntasPadrao;
  }

  function validarCPF(cpf) {
    cpf = cpf.replace(/[^\d]+/g, '');
    if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
    let soma = 0, resto;
    for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i-1, i)) * (11 - i);
    resto = (soma * 10) % 11;
    if (resto === 10 || resto === 11) resto = 0;
    if (resto !== parseInt(cpf.substring(9, 10))) return false;
    soma = 0;
    for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i-1, i)) * (12 - i);
    resto = (soma * 10) % 11;
    if (resto === 10 || resto === 11) resto = 0;
    if (resto !== parseInt(cpf.substring(10, 11))) return false;
    return true;
  }

  function shuffle(array) {
    let m = array.length, t, i;
    while (m) {
      i = Math.floor(Math.random() * m--);
      t = array[m];
      array[m] = array[i];
      array[i] = t;
    }
    return array;
  }

  function iniciarQuiz() {
    const nomeInput = document.getElementById('nome').value.trim();
    const cpfInput = document.getElementById('cpf').value;
    const errorDiv = document.getElementById('cpf-error');
    errorDiv.style.display = 'none';

    if (nomeInput === "") {
      errorDiv.innerText = "POR FAVOR, INFORME SEU NOME COMPLETO.";
      errorDiv.style.display = 'block';
      return;
    }

    if (!validarCPF(cpfInput)) {
      errorDiv.innerText = "POR FAVOR, INFORME UM CPF VÁLIDO.";
      errorDiv.style.display = 'block';
      return;
    }

    const cpfLimpo = cpfInput.replace(/[^\d]+/g, '');
    const participacoes = JSON.parse(localStorage.getItem('quiz_participacoes') || '{}');

    if (participacoes[cpfLimpo]) {
      errorDiv.innerText = "ESTE CPF JÁ PARTICIPOU DO QUIZ ANTERIORMENTE!";
      errorDiv.style.display = 'block';
      return;
    }

    nomeAtual = nomeInput;
    cpfAtual = cpfLimpo;
    renderizarPerguntas();
    
    document.getElementById('step-cpf').classList.remove('active');
    document.getElementById('step-quiz').classList.add('active');
  }

  function renderizarPerguntas() {
    const container = document.getElementById('questions-container');
    container.innerHTML = "";
    perguntasCarregadas = obterPerguntas();

    perguntasCarregadas.forEach((p, index) => {
      const opcoesObjetos = p.opcoes.map((texto, i) => ({
        texto: texto,
        isCorreta: (i === p.correta)
      }));

      const opcoesEmbaralhadas = shuffle([...opcoesObjetos]);

      let qHtml = `<div class="question" id="q-card-${index}">
        <p>${p.enunciado}</p>`;
        
      opcoesEmbaralhadas.forEach((op) => {
        qHtml += `
          <label class="option">
            <input type="radio" name="q${index}" value="${op.isCorreta ? '10' : '0'}" data-texto="${op.texto}" data-correta="${op.isCorreta}" required>
            ${op.texto}
          </label>`;
      });
      
      qHtml += `<div id="feedback-q${index}"></div></div>`;
      container.innerHTML += qHtml;
    });
  }

  async function finalizarQuiz() {
    const form = document.getElementById('quiz-form');
    if (!form.checkValidity()) {
      alert("POR FAVOR, RESPONDA A TODAS AS PERGUNTAS.");
      return;
    }

    let pontuacaoTotal = 0;
    const summaryContainer = document.getElementById('summary-container');
    summaryContainer.innerHTML = "";

    // Processa o resultado de cada pergunta
    perguntasCarregadas.forEach((p, index) => {
      const selecionada = document.querySelector(`input[name="q${index}"]:checked`);
      const isCorreta = selecionada.getAttribute('data-correta') === 'true';
      const textoSelecionado = selecionada.getAttribute('data-texto');
      const pontos = isCorreta ? 10 : 0;
      pontuacaoTotal += pontos;

      // Exibe sinalização na tela do quiz
      const feedbackDiv = document.getElementById(`feedback-q${index}`);
      if (isCorreta) {
        feedbackDiv.className = "feedback-box feedback-correct";
        feedbackDiv.innerText = "✔ RESPOSTA CORRETA (+10 PONTOS)";
      } else {
        feedbackDiv.className = "feedback-box feedback-wrong";
        feedbackDiv.innerText = "✖ RESPOSTA ERRADA (0 PONTOS)";
      }

      // Monta o resumo detalhado para a página final
      const cardResumo = document.createElement('div');
      cardResumo.className = `summary-card ${isCorreta ? 'correct' : 'wrong'}`;
      cardResumo.innerHTML = `
        <strong>${p.enunciado}</strong><br>
        <span style="font-size: 13px;">SUA RESPOSTA: ${textoSelecionado}</span><br>
        <span style="font-size: 13px; font-weight: bold; color: ${isCorreta ? '#28a745' : '#dc3545'};">
          ${isCorreta ? '✔ RESPOSTA CORRETA' : '✖ RESPOSTA ERRADA'} — PONTUAÇÃO: ${pontos} PONTOS
        </span>
      `;
      summaryContainer.appendChild(cardResumo);
    });

    const btnSubmit = document.getElementById('btn-submit');
    btnSubmit.disabled = true;
    btnSubmit.innerText = "ENVIANDO RESPOSTAS...";

    // Envio dos dados para o Google Sheets via API
    try {
      if (URL_GOOGLE_SCRIPT && !URL_GOOGLE_SCRIPT.includes("https://script.google.com/macros/s/AKfycbzjW5rqhIPsA33YYr5GQC6Fq81PcgB3-zeQlPcmztw9Qm3bxuN8rMnkfceFZuRWsYnsEA/exec")) {
        await fetch(URL_GOOGLE_SCRIPT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome: nomeAtual,
            cpf: cpfAtual,
            pontuacao: pontuacaoTotal
          })
        });
      }
    } catch (e) {
      console.error("Erro ao enviar dados para a planilha:", e);
    }

    // Trava de participação local
    const participacoes = JSON.parse(localStorage.getItem('quiz_participacoes') || '{}');
    participacoes[cpfAtual] = { nome: nomeAtual, pontuacao: pontuacaoTotal, data: new Date().toISOString() };
    localStorage.setItem('quiz_participacoes', JSON.stringify(participacoes));

    // Exibe o resultado final após 1.5 segundos para visualização do feedback
    setTimeout(() => {
      document.getElementById('score-display').innerText = `${nomeAtual}, SUA PONTUAÇÃO TOTAL FOI: ${pontuacaoTotal} PONTOS!`;
      document.getElementById('step-quiz').classList.remove('active');
      document.getElementById('step-result').classList.add('active');
    }, 1500);
  }

  function solicitarSenhaAdmin() {
    const senhaDigitada = prompt("DIGITE A SENHA DE ADMINISTRADOR:");
    if (senhaDigitada === SENHA_ADMIN) abrirConfiguracoes();
    else if (senhaDigitada !== null) alert("SENHA INCORRETA!");
  }

  function abrirConfiguracoes() {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById('step-admin').classList.add('active');
    const container = document.getElementById('admin-questions-list');
    container.innerHTML = "";
    obterPerguntas().forEach(p => adicionarPerguntaUI(p.enunciado, p.opcoes, p.correta));
  }

  function adicionarPerguntaUI(enunciado = "", opcoes = null, corretaIdx = 0) {
    const container = document.getElementById('admin-questions-list');
    const qIndex = container.children.length;
    if (!opcoes) {
      opcoes = ["", "", "", ""];
    }
    
    let htmlOptions = "";
    opcoes.forEach((opTexto, i) => {
      const isChecked = (i === corretaIdx) ? "checked" : "";
      htmlOptions += `
        <div class="admin-option-row">
          <input type="text" class="opt-text" placeholder="TEXTO DA ALTERNATIVA" value="${opTexto}">
          <label>
            <input type="radio" name="correct_q${qIndex}" class="opt-correct" value="${i}" ${isChecked}>
            CORRETA
          </label>
        </div>`;
    });

    const card = document.createElement('div');
    card.className = 'admin-card';
    card.innerHTML = `
      <button class="btn-delete-q" onclick="this.parentElement.remove()">EXCLUIR PERGUNTA</button>
      <label>PERGUNTA ${qIndex + 1}:</label>
      <input type="text" class="q-enunciado" value="${enunciado}" placeholder="DIGITE O ENUNCIADO">
      <label>ALTERNATIVAS (SELEÇIONE A CORRETA):</label>
      <div class="options-group">${htmlOptions}</div>`;
    container.appendChild(card);
  }

  function salvarConfiguracoes() {
    const cards = document.querySelectorAll('.admin-card');
    const novasPerguntas = [];

    cards.forEach((card) => {
      const enunciado = card.querySelector('.q-enunciado').value;
      const optionRows = card.querySelectorAll('.admin-option-row');
      const opcoes = [];
      let corretaIdx = 0;

      optionRows.forEach((row, i) => {
        const texto = row.querySelector('.opt-text').value;
        const isCorrect = row.querySelector('.opt-correct').checked;
        if (texto.trim() !== "") {
          opcoes.push(texto);
          if (isCorrect) corretaIdx = opcoes.length - 1;
        }
      });

      if (enunciado.trim() !== "" && opcoes.length > 0) {
        novasPerguntas.push({
          enunciado: enunciado,
          opcoes: opcoes,
          correta: corretaIdx
        });
      }
    });

    if (novasPerguntas.length === 0) { 
      alert("ADICIONE PELO MENOS UMA PERGUNTA VÁLIDA!"); 
      return; 
    }

    localStorage.setItem('quiz_perguntas_config', JSON.stringify(novasPerguntas));
    alert("PERGUNTAS SALVAS COM SUCESSO!");
    cancelarConfiguracoes();
  }

  function cancelarConfiguracoes() {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById('step-cpf').classList.add('active');
  }
</script>

</body>
</html>
